<body>
<canvas id="c" tabindex="0"></canvas>
<script>
'use strict';
/* =========================================================
   BACK TO 505 — a tiny 1-bit night game
   Everything (pixels, font, sound) is generated in code.
   ========================================================= */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,S=2,fb,imgD,buf32;
let cx0=0,cy0=0,cx1=0,cy1=0;
const isTouch=matchMedia('(pointer:coarse)').matches;

function resize(){
  const vw=innerWidth||document.documentElement.clientWidth||800,vh=innerHeight||document.documentElement.clientHeight||600;
  S=Math.max(2,Math.floor(Math.min(vw,vh)/260));
  W=Math.max(64,Math.min(720,Math.floor(vw/S)));H=Math.max(64,Math.min(520,Math.floor(vh/S)));
  if(W===cv.width&&H===cv.height&&fb&&fb.length===W*H){cv.style.width=W*S+'px';cv.style.height=H*S+'px';return;}
  cv.width=W;cv.height=H;cv.style.width=W*S+'px';cv.style.height=H*S+'px';
  fb=new Uint8Array(W*H);imgD=ctx.createImageData(W,H);buf32=new Uint32Array(imgD.data.buffer);
  noClip();
}
function noClip(){cx0=0;cy0=0;cx1=W;cy1=H;}
function withClip(x,y,w,h,fn){const a=[cx0,cy0,cx1,cy1];cx0=Math.max(cx0,Math.floor(x));cy0=Math.max(cy0,Math.floor(y));cx1=Math.min(cx1,Math.floor(x+w));cy1=Math.min(cy1,Math.floor(y+h));if(cx1>cx0&&cy1>cy0)fn();[cx0,cy0,cx1,cy1]=a;}

/* ---------- dithering ---------- */
const B4=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const bay=(x,y)=>B4[((y&3)<<2)|(x&3)];
const B8=new Uint8Array(64);
for(let y=0;y<8;y++)for(let x=0;x<8;x++)B8[y*8+x]=4*B4[(y&3)*4+(x&3)]+[0,2,3,1][(y>>2)*2+(x>>2)];

/* ---------- primitives ---------- */
function ps(x,y,c){x=Math.floor(x);y=Math.floor(y);if(x<cx0||y<cy0||x>=cx1||y>=cy1)return;const i=y*W+x;fb[i]=c===2?1-fb[i]:c;}
function rect(x,y,w,h,c){
  x=Math.round(x);y=Math.round(y);w=Math.round(w);h=Math.round(h);
  const x0=Math.max(cx0,x),y0=Math.max(cy0,y),x1=Math.min(cx1,x+w),y1=Math.min(cy1,y+h);
  const f=typeof c==='function';
  for(let j=y0;j<y1;j++){let i=j*W+x0;for(let k=x0;k<x1;k++,i++){
    if(f){const v=c(k,j);if(v>=0)fb[i]=v;}else fb[i]=c===2?1-fb[i]:c;}}
}
function rrRows(x,y,w,h,r,fn){
  x=Math.round(x);y=Math.round(y);w=Math.round(w);h=Math.round(h);
  r=Math.max(0,Math.min(Math.round(r),w>>1,h>>1));
  for(let j=0;j<h;j++){let d=-1;if(j<r)d=r-j-0.5;else if(j>=h-r)d=j-(h-r)+0.5;
    const ins=d>=0?Math.round(r-Math.sqrt(Math.max(0,r*r-d*d))):0;fn(y+j,x+ins,x+w-ins);}
}
function rrect(x,y,w,h,r,c){rrRows(x,y,w,h,r,(j,a,b)=>rect(a,j,b-a,1,c));}
function circ(cx,cy,r,c){const R=Math.ceil(r);for(let y=-R;y<=R;y++){const w=Math.sqrt(Math.max(0,r*r-y*y));const a=Math.round(cx-w),b=Math.round(cx+w);rect(a,Math.round(cy)+y,b-a,1,c);}}
function ocirc(cx,cy,r,c,step){for(let j=Math.floor(cy-r-1);j<=Math.ceil(cy+r+1);j++)for(let i=Math.floor(cx-r-1);i<=Math.ceil(cx+r+1);i++){const d=Math.hypot(i+0.5-cx,j+0.5-cy);if(Math.abs(d-r)<0.55){if(step&&(((i+j)%step)+step)%step)continue;ps(i,j,c);}}}
function line(x0,y0,x1,y1,c,plot){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;
  for(;;){plot?plot(x0,y0):ps(x0,y0,c);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}
function applyFade(f){if(f>=1)return;const th=f*64;for(let y=0;y<H;y++){const r=(y&7)*8;for(let x=0;x<W;x++)if(B8[r+(x&7)]>=th)fb[y*W+x]=0;}}
function localFade(x,y,w,h,f){if(f>=1)return;const th=f*64;rect(x,y,w,h,(i,j)=>B8[(j&7)*8+(i&7)]>=th?0:-1);}
function blit(){for(let i=0;i<fb.length;i++)buf32[i]=fb[i]?0xFFFFFFFF:0xFF000000;ctx.putImageData(imgD,0,0);}

/* ---------- pixel font (5x7 + descenders) ---------- */
const G={};
function defG(ch,rows){rows=rows.slice();while(rows.length<9)rows.push(0);let mn=5,mx=-1;
  rows.forEach(r=>{for(let b=0;b<5;b++)if(r&(16>>b)){mn=Math.min(mn,b);mx=Math.max(mx,b);}});
  if(mx<0){mn=0;mx=2;}G[ch]={rows,mn,w:mx-mn+1};}
const FD={
A:[14,17,17,31,17,17,17],B:[30,17,17,30,17,17,30],C:[14,17,16,16,16,17,14],D:[30,17,17,17,17,17,30],
E:[31,16,16,30,16,16,31],F:[31,16,16,30,16,16,16],G:[14,17,16,23,17,17,15],H:[17,17,17,31,17,17,17],
I:[14,4,4,4,4,4,14],J:[7,2,2,2,2,18,12],K:[17,18,20,24,20,18,17],L:[16,16,16,16,16,16,31],
M:[17,27,21,21,17,17,17],N:[17,17,25,21,19,17,17],O:[14,17,17,17,17,17,14],P:[30,17,17,30,16,16,16],
Q:[14,17,17,17,21,18,13],R:[30,17,17,30,20,18,17],S:[15,16,16,14,1,1,30],T:[31,4,4,4,4,4,4],
U:[17,17,17,17,17,17,14],V:[17,17,17,17,17,10,4],W:[17,17,17,21,21,21,10],X:[17,17,10,4,10,17,17],
Y:[17,17,10,4,4,4,4],Z:[31,1,2,4,8,16,31],
a:[0,0,14,1,15,17,15],b:[16,16,22,25,17,17,30],c:[0,0,14,16,16,17,14],d:[1,1,13,19,17,17,15],
e:[0,0,14,17,31,16,14],f:[6,9,8,28,8,8,8],g:[0,0,15,17,17,17,15,1,14],h:[16,16,22,25,17,17,17],
i:[4,0,12,4,4,4,14],j:[2,0,6,2,2,2,2,18,12],k:[16,16,18,20,24,20,18],l:[12,4,4,4,4,4,14],
m:[0,0,26,21,21,21,21],n:[0,0,22,25,17,17,17],o:[0,0,14,17,17,17,14],p:[0,0,30,17,17,17,30,16,16],
q:[0,0,15,17,17,17,15,1,1],r:[0,0,22,25,16,16,16],s:[0,0,15,16,14,1,30],t:[8,8,28,8,8,9,6],
u:[0,0,17,17,17,19,13],v:[0,0,17,17,17,10,4],w:[0,0,17,17,21,21,10],x:[0,0,17,10,4,10,17],
y:[0,0,17,17,17,17,15,1,14],z:[0,0,31,2,4,8,31],
'0':[14,17,19,21,25,17,14],'1':[4,12,4,4,4,4,14],'2':[14,17,1,2,4,8,31],'3':[31,2,4,2,1,17,14],
'4':[2,6,10,18,31,2,2],'5':[31,16,30,1,1,17,14],'6':[6,8,16,30,17,17,14],'7':[31,1,2,4,8,8,8],
'8':[14,17,17,14,17,17,14],'9':[14,17,17,15,1,2,12],
' ':[0],'.':[0,0,0,0,0,12,12],',':[0,0,0,0,0,12,4,8],':':[0,12,12,0,12,12,0],'!':[4,4,4,4,4,0,4],
'?':[14,17,1,2,4,0,4],'-':[0,0,0,14,0,0,0],'/':[1,1,2,4,8,16,16],"'":[4,4,8,0,0,0,0],
'(':[2,4,8,8,8,4,2],')':[8,4,2,2,2,4,8],'>':[8,4,2,1,2,4,8],'<':[2,4,8,16,8,4,2],'+':[0,4,4,31,4,4,0],
'&':[12,18,20,8,21,18,13],'_':[0,0,0,0,0,0,31],'"':[10,10,0,0,0,0,0],'@':[14,17,23,21,23,16,14],'[':[14,8,8,8,8,8,14],']':[14,2,2,2,2,2,14],'=':[0,0,31,0,31,0,0]
};
for(const k in FD)defG(k,FD[k]);
function textW(s,sc=1,bold=false){let w=0;for(const ch of s){const g=G[ch]||G['?'];w+=(g.w+1+(bold?1:0))*sc;}return Math.max(0,w-sc);}
function text(s,x,y,sc=1,c=1,bold=false){
  x=Math.round(x);y=Math.round(y);let cx=x;const f=typeof c==='function';
  for(const ch of s){const g=G[ch]||G['?'];
    for(let r=0;r<9;r++){const row=g.rows[r];if(!row)continue;
      for(let b=g.mn;b<g.mn+g.w;b++)if(row&(16>>b)){const px=cx+(b-g.mn)*sc,py=y+r*sc;
        if(f){for(let u=0;u<sc+(bold?1:0);u++)for(let v=0;v<sc;v++){const q=c(px+u,py+v);if(q>=0)ps(px+u,py+v,q);}}
        else rect(px,py,sc+(bold?1:0),sc,c);}}
    cx+=(g.w+1+(bold?1:0))*sc;}
  return cx-x;
}
function ctext(s,cx,y,sc=1,c=1,bold=false){text(s,cx-textW(s,sc,bold)/2,y,sc,c,bold);}
function wrap(s,maxW,sc=1){const out=[];let cur='';for(const w of s.split(' ')){const t=cur?cur+' '+w:w;if(textW(t,sc)>maxW&&cur){out.push(cur);cur=w;}else cur=t;}if(cur)out.push(cur);return out;}

/* ---------- seeded random ---------- */
function rng(seed){let s=seed|0;return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------- night sky ---------- */
const CLOUD=[[0,0,1],[1.1,-0.45,0.95],[2.1,-0.1,0.85],[2.9,0.25,0.6],[-0.9,0.3,0.6]];
const CRATERS=[[-0.38,-0.05,0.3],[-0.15,0.22,0.22],[0.28,0.32,0.13],[0.36,-0.22,0.09],[-0.05,-0.48,0.08],[0.05,0.05,0.06]];
function drawSky(x,y,w,h,t,o){
  x=Math.round(x);y=Math.round(y);w=Math.round(w);h=Math.round(h);
  withClip(x,y,w,h,()=>{
    for(let j=cy0;j<cy1;j++){const l=o.l0+(o.l1-o.l0)*(j-y)/h;for(let i=cx0;i<cx1;i++)fb[j*W+i]=bay(i-x,j-y)<l?1:0;}
    // stars
    const R=rng(o.seed||1),n=Math.floor(w*h/110*(o.sd||1));
    for(let k=0;k<n;k++){const fx=R(),fy=R()*0.9,ph=R()*6.28,big=R()<0.07;
      const px=Math.round(x+fx*w),py=Math.round(y+fy*h),tw=Math.sin(t*1.6+ph);
      if(big){if(tw>-0.2){ps(px,py,1);ps(px-1,py,1);ps(px+1,py,1);ps(px,py-1,1);ps(px,py+1,1);if(tw>0.6){ps(px-2,py,1);ps(px+2,py,1);ps(px,py-2,1);ps(px,py+2,1);}}else ps(px,py,1);}
      else if(tw>-0.5)ps(px,py,1);}
    // moon
    if(o.moon){const mx=x+o.moon[0]*w,my=y+o.moon[1]*h,r=Math.max(3,o.moon[2]*w),hr=r*2.4;
      for(let j=Math.floor(my-hr);j<my+hr;j++)for(let i=Math.floor(mx-hr);i<mx+hr;i++){const d=Math.hypot(i+0.5-mx,j+0.5-my);if(d>r&&d<hr){const l=8*(1-(d-r)/(hr-r));if(bay(i-x,j-y)<l)ps(i,j,1);}}
      circ(mx,my,r,1);
      for(const c of CRATERS){const ccx=mx+c[0]*r,ccy=my+c[1]*r,cr=c[2]*r;
        for(let j=Math.floor(ccy-cr);j<=ccy+cr;j++)for(let i=Math.floor(ccx-cr);i<=ccx+cr;i++)if(Math.hypot(i+0.5-ccx,j+0.5-ccy)<cr&&bay(i,j)<4)ps(i,j,0);}
      for(let j=Math.floor(my-r);j<=my+r;j++)for(let i=Math.floor(mx-r);i<=mx+r;i++){const dx=i+0.5-mx,dy=j+0.5-my;if(Math.hypot(dx,dy)<r&&Math.hypot(dx,dy)/r>0.84&&(-dx*0.7+dy*0.7)/r>0.5&&bay(i,j)<5)ps(i,j,0);}
    }
    // clouds
    for(const c of (o.clouds||[])){
      const Rr=c.s*w,span=w+Rr*7;const cxp=x+(((c.fx*w+t*c.sp)%span)+span)%span-Rr*2.5,cyp=y+c.fy*h;
      const top=cyp-1.4*Rr,base=cyp+0.6*Rr;
      for(let j=Math.floor(top);j<=base;j++)for(let i=Math.floor(cxp-1.6*Rr);i<=cxp+3.6*Rr;i++){
        let ins=false;for(const b of CLOUD){const dx=i+0.5-(cxp+b[0]*Rr),dy=j+0.5-(cyp+b[1]*Rr);if(dx*dx+dy*dy<(b[2]*Rr)*(b[2]*Rr)){ins=true;break;}}
        if(!ins)continue;const v=(j-top)/(base-top);const l=16-Math.max(0,v-0.4)*24;ps(i,j,bay(i-Math.round(cxp),j)<l?1:0);}
    }
  });
}

/* ---------- audio (Web Audio, all synthesized) ---------- */
let AC=null,MS=null,RB=null,muted=false,amb=null,routeSnd=null,NB=null;
function au(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();MS=AC.createGain();MS.gain.value=0.9;MS.connect(AC.destination);
  RB=AC.createBiquadFilter();RB.type='highpass';RB.frequency.value=420;const pk=AC.createBiquadFilter();pk.type='peaking';pk.frequency.value=2400;pk.gain.value=5;RB.connect(pk).connect(MS);}
  if(AC.state==='suspended')AC.resume();}catch(e){AC=null;}}
function noiseBuf(){if(NB)return NB;NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return NB;}
function noiseSrc(){const s=AC.createBufferSource();s.buffer=noiseBuf();s.loop=true;return s;}
const mf=m=>440*Math.pow(2,(m-69)/12);
function env(g,t,a,peak,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec);}
function startAmb(){
  if(!AC||amb)return;const t=AC.currentTime;const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1,t+3);g.connect(MS);
  const n=noiseSrc(),lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=300;const ng=AC.createGain();ng.gain.value=0.045;n.connect(lp).connect(ng).connect(g);n.start();
  const pf=AC.createBiquadFilter();pf.type='lowpass';pf.frequency.value=650;pf.Q.value=0.6;const pg=AC.createGain();pg.gain.value=0.03;pf.connect(pg).connect(g);
  const lfo=AC.createOscillator();lfo.frequency.value=0.07;const lg=AC.createGain();lg.gain.value=220;lfo.connect(lg).connect(pf.frequency);lfo.start();
  const trem=AC.createOscillator();trem.frequency.value=5.2;const tg=AC.createGain();tg.gain.value=0.006;trem.connect(tg).connect(pg.gain);trem.start();
  const oscs=[];for(let i=0;i<6;i++){const o=AC.createOscillator();o.type=i%2?'triangle':'sine';o.detune.value=i%2?6:-6;o.connect(pf);o.start();oscs.push(o);}
  const chords=[[50,57,65],[46,53,62],[53,57,60],[45,52,61]];let ci=0;
  const setChord=()=>{const c=chords[ci++%chords.length];oscs.forEach((o,i)=>o.frequency.setTargetAtTime(mf(c[i>>1]-(i>3?0:0)),AC.currentTime,1.4));};
  setChord();const iv=setInterval(setChord,7500);
  const car=()=>{const s=noiseSrc(),bp=AC.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.2;const cg=AC.createGain();const t0=AC.currentTime;
    bp.frequency.setValueAtTime(180,t0);bp.frequency.linearRampToValueAtTime(520,t0+2.2);bp.frequency.linearRampToValueAtTime(160,t0+5);
    cg.gain.setValueAtTime(0.0001,t0);cg.gain.exponentialRampToValueAtTime(0.05,t0+2.2);cg.gain.exponentialRampToValueAtTime(0.0001,t0+5);
    s.connect(bp).connect(cg).connect(g);s.start(t0);s.stop(t0+5.1);};
  const iv2=setInterval(car,14000);setTimeout(car,4000);
  amb={g,iv,iv2};
}
function setAmb(v){if(amb)amb.g.gain.setTargetAtTime(v,AC.currentTime,0.6);}
function mallet(f,t,v=0.16){const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),g2=AC.createGain();
  o.type='sine';o2.type='sine';o.frequency.value=f;o2.frequency.value=f*3.99;env(g,t,0.005,v,0.5);env(g2,t,0.003,v*0.4,0.07);
  o.connect(g).connect(RB);o2.connect(g2).connect(RB);o.start(t);o2.start(t);o.stop(t+0.6);o2.stop(t+0.1);}
function buzz(t,d){const o=AC.createOscillator(),lp=AC.createBiquadFilter(),g=AC.createGain();o.type='square';o.frequency.value=148;lp.type='lowpass';lp.frequency.value=240;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.07,t+0.03);g.gain.setValueAtTime(0.07,t+d-0.04);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(lp).connect(g).connect(MS);o.start(t);o.stop(t+d+0.02);}
function ring(at){if(!AC)return;const seq=[76,83,80,76,78,0,83,80,78,76,71,0];
  seq.forEach((m,i)=>{if(m){mallet(mf(m),at+i*0.15);if(i%4===0)mallet(mf(m-12),at+i*0.15,0.07);}});buzz(at,0.45);buzz(at+0.9,0.45);}
function click(t,f=2600,d=0.02,v=0.35){if(!AC)return;const s=noiseSrc(),bp=AC.createBiquadFilter(),g=AC.createGain();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=2;env(g,t,0.001,v,d);s.connect(bp).connect(g).connect(MS);s.start(t);s.stop(t+d+0.05);}
function tick(){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.frequency.value=1700;env(g,t,0.002,0.08,0.03);o.connect(g).connect(MS);o.start(t);o.stop(t+0.05);}
function unlockSnd(){if(!AC)return;const t=AC.currentTime;click(t,3000,0.015);click(t+0.07,2000,0.02);}
function lockSnd(){if(!AC)return;const t=AC.currentTime;click(t,1500,0.03,0.4);}

function drawCarScene(t){
  const hz=Math.round(H*0.44);
  drawSky(0,0,W,hz,t,{l0:0.1,l1:1.3,seed:7,sd:0.7,moon:[0.82,0.3,0.035],clouds:[]});
  const R=rng(99);let x=0;
  while(x<W){const bw=6+Math.floor(R()*16),bh=4+Math.floor(R()*H*0.12);rect(x,hz-bh,bw,bh,0);
    for(let j=hz-bh+2;j<hz-1;j+=3)for(let i=x+1;i<x+bw-1;i+=3)if(R()<0.22&&Math.sin(t*0.3+i*j)>-0.7)ps(i,j,1);x+=bw+Math.floor(R()*3);}
  for(let i=0;i<W;i++)ps(i,hz,(i%3===0)?1:0);
  for(let y=hz+1;y<H;y++){const p=(y-hz)/(H-hz),half=W*0.04+p*W*0.75,c=W/2;
    for(let i=0;i<W;i++){let v=0;const dx=Math.abs(i-c);
      if(dx<half){const hl=3.2*p*p*(1-dx/half);v=bay(i,y)<hl?1:0;}
      if(Math.abs(dx-half)<0.8)v=1;
      if(dx<Math.max(0.6,p*3)&&Math.floor(6/(p+0.06)+t*9)%2===0)v=1;
      fb[y*W+i]=v;}}
  for(let k=0;k<6;k++){const ph=((t*0.35+k/6)%1),p=ph*ph,y=hz+p*(H-hz),half=W*0.04+p*W*0.75,side=k%2?1:-1;
    const x=W/2+side*half*1.15,hp=Math.max(2,p*H*0.75);line(x,y,x,y-hp,1);
    const ax=x-side*Math.max(2,p*W*0.08);line(x,y-hp,ax,y-hp,1);
    const gr=Math.max(2,p*W*0.06);for(let j=Math.floor(y-hp-gr);j<y-hp+gr*1.5;j++)for(let i=Math.floor(ax-gr*1.5);i<ax+gr*1.5;i++){const d=Math.hypot(i-ax,(j-(y-hp))*1.2);if(d<gr*1.5&&bay(i,j)<8*(1-d/(gr*1.5)))ps(i,j,1);}
    rect(ax-1,y-hp,3,1,1);}
  const dy=Math.round(H*0.84);rect(0,dy,W,H-dy,0);for(let i=0;i<W;i+=2)ps(i,dy,1);
  const wr=W*0.3;ocirc(W/2,dy+wr*0.75,wr,1);ocirc(W/2,dy+wr*0.75,wr-3,1);
}
function drawRoute(t){
  if(route==='plane')drawPlaneScene(t);else drawCarScene(t);
  const sc=W>=300?2:1,title=route==='plane'?'Take a plane':'drive a car';
  const tw=textW(title,sc);rect(W/2-tw/2-4,4,tw+8,7*sc+8,0);ctext(title,W/2,8,sc,1);
  const dots='.'.repeat(1+Math.floor(t*2)%3);const tc='to be continued'+dots;
  rect(W/2-textW('to be continued...')/2-3,H-46,textW('to be continued...')+6,11,0);
  text(tc,W/2-textW('to be continued...')/2,H-44,1,1);
  backRect=drawButton('back to notes',W/2,H-18,1,backHover);
}

/* ---------- start screen ---------- */
const DIAN=['.#########.','.....#.....','###########','#....#....#','#.##.#.##.#','...........','..#######..','..#..#..#..','..#######..','..#..#..#..','..#######..','.....#....#','.....######'];
function drawDian(x,y,c){for(let r=0;r<DIAN.length;r++)for(let k=0;k<11;k++)if(DIAN[r][k]==='#')ps(x+k,y+r,c);}
function drawStart(t){
  const sc=W>=360?3:2,title='back to 505...';
  drawSky(0,0,W,H,t,{l0:0,l1:1.4,seed:5,sd:0.5,clouds:[]});
  const cy=Math.round(H*0.36),tw=textW(title,sc);
  rect(W/2-tw/2-6,cy-6,tw+12,9*sc+12,0);
  text(title,W/2-tw/2,cy,sc,1);
  // Created by Ciel Chang (電電)
  const a='Created by Ciel Chang (',b=')',wa=textW(a),wb=textW(b),gw=wa+2+11+2+11+2+wb;
  const sy=cy+9*sc+12,sx=Math.round(W/2-gw/2);
  rect(sx-4,sy-5,gw+8,19,0);
  text(a,sx,sy,1,1);drawDian(sx+wa+2,sy-5,1);drawDian(sx+wa+15,sy-5,1);text(b,sx+wa+28,sy,1,1);
  if(Math.floor(t*1.6)%2===0){const bl=isTouch?'tap to begin':'click to begin';rect(W/2-textW(bl)/2-4,Math.round(H*0.66)-3,textW(bl)+8,13,0);ctext(bl,W/2,Math.round(H*0.66),1,1);}
  const hl='headphones on  -  sound will play';rect(W/2-textW(hl)/2-4,H-27,textW(hl)+8,isTouch?13:24,0);
  ctext(hl,W/2,H-24,1,1);
  if(!isTouch)ctext('M = mute',W/2,H-13,1,1);
}

/* ---------- update / render ---------- */
function update(dt){
  if(state==='room'){const g=geo(),maxX=g.RW-W,maxY=Math.round(H*0.06);
    if(kd('ArrowLeft','KeyA'))camT-=170*dt;if(kd('ArrowRight','KeyD'))camT+=170*dt;
    if(kd('ArrowUp','KeyW'))camYT-=60*dt;if(kd('ArrowDown','KeyS'))camYT+=60*dt;
    camT=Math.max(0,Math.min(maxX,camT));camYT=Math.max(-maxY,Math.min(maxY,camYT));
    const k=Math.min(1,dt*6);camX+=(camT-camX)*k;camY+=(camYT-camY)*k;}
  if(state==='lock'&&!trans){
    if(!dragging){if(kd('ArrowRight','KeyD'))knob+=dt*0.9;else if(knob<1)knob=Math.max(0,knob-dt*2.4);}
    knob=Math.max(0,Math.min(1,knob));if(knob>=1&&!dragging)unlock();}
  if(state==='room505')updateRoom();
  if(state==='void'&&now-voidT0>0.9){setState('sky');skyT0=now;skyPage=false;skyHover=-1;startSkyAudio();}
  if(alertOn&&state==='notes'){const c=Math.max(0,5-Math.floor(now-alertT0));if(c!==alertCount){alertCount=c;tick();}}
  if(state==='plane'&&PT){const st=now-planeT0;pSpeed=st<PT.a2e?1.1:1.1*Math.max(0,1-(st-PT.a2e)/7);pScroll+=pSpeed*dt;
    if(st>PT.a2e+5&&!trans){fadePA();go('motel',startMotel,3.2);}}
  if(state==='car'&&CT&&now-carT0>CT.me+1.8&&!trans){fadePA();go('motel',startMotel,3.2);}
}
function render(t){
  noClip();
  if(state==='start')drawStart(t);
  else if(state==='room'){drawRoom(t);const ti=now-introT0;
    if(ti<9){const f=Math.max(0,Math.min(1,(ti-3.5)/1.2))*Math.max(0,Math.min(1,(8-ti)/1));if(f>0){let h=isTouch?'swipe to look around':'mouse / WASD / arrows to look around';if(textW(h)>W-8)h=isTouch?'swipe to look':'WASD: look around';rect(W/2-textW(h)/2-3,H-17,textW(h)+6,13,0);ctext(h,W/2,H-14,1,(px,py)=>B8[(py&7)*8+(px&7)]<f*64?1:-1);}}
    if(ti>BTN_T){const sc=(W>=360&&H>=240)?2:1;btnRect=drawButton('Pick up the phone',W/2,H/2,sc,btnHover,Math.min(1,(ti-BTN_T)/0.7));}else btnRect=null;}
  else if(state==='lock'||state==='notes')drawPhone(t);
  else if(state==='route')drawRoute(t);
  else if(state==='plane'&&PT)drawPlaneFlight(t);
  else if(state==='car'&&CT)drawDrive(t);
  else if(state==='motel')drawMotel(t);
  else if(state==='door')drawDoorScene(t);
  else if(state==='room505'&&RS)drawRoom505(t);
  else if(state==='tbc')drawTBC(t);
  else if(state==='sky')drawSkyScene(t);
  if(now-muteShow<1.5){const s=muted?'sound off':'sound on';rect(4,4,textW(s)+6,11,0);text(s,7,6,1,1);}
}
let last=0;
function frame(ms){
  now=ms/1000;const dt=Math.min(0.05,last?now-last:0);last=now;
  update(dt);fb.fill(0);frameLinks=[];
  let f=1;
  if(trans){const p=(now-trans.t0)/trans.dur;if(p>=0.5&&!trans.sw){trans.sw=true;setState(trans.to);trans.fn&&trans.fn();}
    if(p>=1)trans=null;else f=p<0.5?1-2*p:2*p-1;}
  render(now);
  if(state==='room')f*=Math.max(0,Math.min(1,(now-introT0)/3));
  if(state==='plane')f*=Math.max(0,Math.min(1,(now-planeT0)/3));
  if(state==='car')f*=Math.max(0,Math.min(1,(now-carT0)/3));
  if(state==='motel')f*=Math.max(0,Math.min(1,(now-motelT0)/3));
  if(state==='door')f*=Math.max(0,Math.min(1,(now-doorT0)/3));
  if(state==='room505')f*=Math.max(0,Math.min(1,(now-roomT0)/3));
  if(state==='sky')blinkMask(now-skyT0);
  applyFade(f);blit();syncLinks();frameLinks=[];requestAnimationFrame(frame);
}

/* ---------- actions ---------- */
function begin(){au();startAmb();setAmb(1);setState('room');introT0=now;const g=geo();camX=camT=(g.RW-W)/2;camY=camYT=0;
  if(AC){const a=AC.currentTime;ring(a+RING1);ring(a+RING2);}}
function pickUp(){if(trans)return;pickupSnd();go('lock',()=>{knob=0;setAmb(0.55);},1.4);}
function unlock(){knob=1;dragging=false;unlockSnd();setState('notes');unlockT0=now;sel=0;hover=-1;}
function relock(){homePress=now;lockSnd();alertOn=false;setState('lock');knob=0;}
function choose(i){if(trans||alertOn)return;alertRoute=i;alertOn=true;alertT0=now;alertHover=-1;alertCount=5;alertSnd();}
function alertBack(){alertOn=false;alertHover=-1;tick();}
function alertOK(){if(trans||now-alertT0<5)return;tick();
  if(alertRoute===0)go('plane',()=>{alertOn=false;startPlane();},1.6);
  else go('car',()=>{alertOn=false;startCar();},1.6);}
const A1=['Ladies and Gentlemen, Captain ______, Chief Purser ______ and our entire cabin crew would like to welcome you aboard.','The flight time is 7 hours...','Our cruising altitude tonight will be thirty-seven thousand feet, and the weather on arrival is expected to be clear.'];
const A2=['Ladies and gentlemen:','As we start our descent, please make sure your seat backs and tray tables are in their full upright position.','Make sure your seat belt is securely fastened and all carry-on luggage is stowed underneath the seat in front of you or in the overhead bins. Thank you.'];
function startPlane(){planeT0=now;pScroll=0;pBackHover=false;setAmb(0.08);stopRouteSnd();startPlaneAudio();
  if(PA)chime(acT(3.4));
  const a1=babble(A1,5,2,5,118),a2s=a1.end+6.5;if(a1.sent[1])a1.sent[1].emph=[4,5];if(PA)chime(acT(a2s-1.6));const a2=babble(A2,a2s,2,6.5,124);
  PT={a1s:5,a1e:a1.end,a2s,a2e:a2.end,A1:a1,A2:a2};landingSnd(a2.end);}
function startCar(){carT0=now;pBackHover=false;setAmb(0.05);stopRouteSnd();startCarAudio();
  const dj=babble(['Next up for our audience is 505 by Arctic Monkeys.'],4.4,-1,0,138);
  const dje=dj.end,ms=dje+1.0,me=ms+play8bit(ms);
  dj.fadeStart=dje+0.6;dj.fadeDur=1.3;dj.end=dj.fadeStart+dj.fadeDur;
  CT={djs:4.4,dje,ms,me,dj};}
function startMotel(){stopPlaneAudio();motelT0=now;room505=Math.floor(Math.random()*1000);walkHover=false;walkRect=null;setAmb(0.06);startMotelAudio();}
function walkIn(){if(trans||!walkRect)return;stepsSnd();fadePA();go('door',()=>{stopPlaneAudio();doorVar=Math.floor(Math.random()*3);doorT0=now;knocked=false;doorHover=false;startMotelAudio();},2.4);}
function backFromPlane(){if(trans)return;tick();go('notes',()=>{stopPlaneAudio();setAmb(0.55);unlockT0=-9;hover=-1;alertOn=false;},1.2);}
function back(){if(trans)return;tick();go('notes',()=>{stopRouteSnd();setAmb(0.55);unlockT0=-9;hover=-1;},1.2);}

/* ---------- input ---------- */
function toLocal(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H];}
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.focus();try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const [x,y]=toLocal(e);ptr={down:true,x,y,sx:x,sy:y,moved:false,type:e.pointerType,camS:camT,camYS:camYT};
  if(trans)return;
  if(state==='start'){begin();return;}
  if(state==='lock'){const p=pgeo();if(inR(homeRect,x,y)){homePress=now;tick();return;}
    if(x>=p.sx&&x<p.sx+p.sw&&y>=p.sy&&y<p.sy+p.sh){dragging=true;dragX=x;dragK=knob;}}
});
cv.addEventListener('pointermove',e=>{const [x,y]=toLocal(e);ptr.x=x;ptr.y=y;if(ptr.down&&Math.hypot(x-ptr.sx,y-ptr.sy)>4)ptr.moved=true;
  if(state==='room'){const g=geo(),maxY=Math.round(H*0.06);
    if(ptr.down){camT=ptr.camS-(x-ptr.sx)*1.3;camYT=Math.max(-maxY,Math.min(maxY,ptr.camYS-(y-ptr.sy)*0.4));}
    else if(e.pointerType==='mouse'){camT=(x/W)*(g.RW-W);camYT=((y/H)-0.5)*2*maxY;}
    btnHover=inR(btnRect,x,y);}
  else if(state==='lock'&&dragging){const p=pgeo();const range=p.sw-14-4-Math.round(Math.max(14,Math.round(p.sw*0.13))*1.7);knob=Math.max(0,Math.min(1,dragK+(x-dragX)/range));}
  else if(state==='notes'){if(alertOn){alertHover=inR(alertOkRect,x,y)?0:(inR(alertBackRect,x,y)?1:-1);}else{hover=-1;linkRects.forEach((r,k)=>{if(inR(r,x,y))hover=k;});}}
  else if(state==='plane'||state==='car'||state==='tbc')pBackHover=inR(pBackRect,x,y);
  else if(state==='motel')walkHover=inR(walkRect,x,y);
  else if(state==='room505')nextHover=inR(nextRect,x,y);
  else if(state==='sky'){skyHover=-1;if(skyPage){if(inR(pageBack,x,y))skyHover=9;}else skyBtns.forEach((r,k)=>{if(inR(r,x,y))skyHover=k;});}
  else if(state==='door'){mouseX=x;mouseY=y;doorHover=inR(doorRect,x,y)||inR(knockRect,x,y);}
  else if(state==='route')backHover=inR(backRect,x,y);
  cv.style.cursor=(btnHover&&state==='room')||(state==='notes'&&(alertOn?alertHover>=0:hover>=0))||((state==='plane'||state==='car'||state==='tbc')&&pBackHover)||(state==='motel'&&walkHover)||(state==='door'&&doorHover&&now-doorT0>3)||(state==='room505'&&nextHover)||(state==='sky'&&skyHover>=0&&skyHover!==3)||(backHover&&state==='route')||(state==='notes'&&inR(homeRect,x,y))?'pointer':(dragging?'grabbing':'default');
});
function endPtr(e){const [x,y]=toLocal(e);const wasDown=ptr.down;ptr.down=false;if(!wasDown||trans)return;
  if(state==='room'){if(!ptr.moved&&btnRect&&inR(btnRect,x,y))pickUp();}
  else if(state==='lock'){if(dragging){dragging=false;if(knob>0.95)unlock();}}
  else if(state==='notes'&&alertOn){if(inR(alertOkRect,x,y))alertOK();else if(inR(alertBackRect,x,y))alertBack();else if(inR(homeRect,x,y))relock();if(e.pointerType!=='mouse')alertHover=-1;}
  else if(state==='plane'||state==='car'||state==='tbc'){if(!ptr.moved&&inR(pBackRect,x,y))backFromPlane();}
  else if(state==='motel'){if(!ptr.moved&&inR(walkRect,x,y))walkIn();}
  else if(state==='room505'){if(!ptr.moved&&inR(nextRect,x,y))advance();}
  else if(state==='sky'&&now-skyT0>2.5){if(skyPage){if(inR(pageBack,x,y)||!inR(pageBack.panel,x,y)){skyPage=false;tick();}}else{skyBtns.forEach((r,k)=>{if(inR(r,x,y)){if(k===2){skyPage=true;softChime();}else if(k===4){softChime();restartGame();}else if(k<2)softChime();}});}}
  else if(state==='door'){if(!ptr.moved&&(inR(doorRect,x,y)||inR(knockRect,x,y)))knock();}
  else if(state==='notes'){if(!ptr.moved){let hit=-1;linkRects.forEach((r,k)=>{if(inR(r,x,y))hit=k;});if(hit>=0)choose(hit);else if(inR(homeRect,x,y))relock();}
    if(e.pointerType!=='mouse')hover=-1;}
  else if(state==='route'){if(!ptr.moved&&inR(backRect,x,y))back();}
}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',e=>{ptr.down=false;dragging=false;});
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  keys.add(e.code);if(e.repeat)return;
  if(e.code==='KeyM'){if(AC)toggleMute();return;}
  if(trans)return;
  const ok=e.code==='Enter'||e.code==='Space'||e.code==='NumpadEnter';
  if(state==='start'){begin();return;}
  if(state==='room'&&ok&&btnRect)pickUp();
  else if(state==='notes'&&alertOn){
    if(['ArrowUp','KeyW','ArrowDown','KeyS'].includes(e.code)){alertHover=alertHover===0?1:0;}
    else if(ok){if(alertHover===1)alertBack();else alertOK();}
    else if(e.code==='Escape'||e.code==='Backspace')alertBack();}
  else if(state==='plane'||state==='car'||state==='tbc'){if(e.code==='Escape'||(ok&&pBackRect))backFromPlane();}
  else if(state==='sky'){if(e.code==='Escape'&&skyPage){skyPage=false;tick();}}
  else if(state==='room505'){if((ok||e.code==='ArrowRight'||e.code==='KeyD')&&nextRect)advance();else if(e.code==='Escape'){RS=null;backFromPlane();}}
  else if(state==='door'){if(ok)knock();else if(e.code==='Escape')backFromPlane();}
  else if(state==='motel'){if(ok||e.code==='KeyW'||e.code==='ArrowUp')walkIn();else if(e.code==='Escape')backFromPlane();}
  else if(state==='notes'){
    if(['ArrowUp','KeyW','ArrowDown','KeyS'].includes(e.code)){hover=-1;sel=1-sel;tick();}
    else if(ok)choose(hover>=0?hover:sel);
    else if(e.code==='Escape'||e.code==='Backspace')relock();}
  else if(state==='route'&&(ok||e.code==='Escape'))back();
});
addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('blur',()=>keys.clear());
addEventListener('resize',resize);
try{new ResizeObserver(()=>resize()).observe(document.documentElement);}catch(e){}
setInterval(()=>{const vw=innerWidth,vh=innerHeight;if(vw&&vh&&(Math.abs(cv.width*S-vw)>S*2&&cv.width<720)&&(Math.abs(cv.height*S-vh)>S*2&&cv.height<520))resize();},1000);
document.addEventListener('visibilitychange',()=>{if(!AC)return;if(document.hidden)AC.suspend();else AC.resume();});

resize();requestAnimationFrame(frame);
</script>
